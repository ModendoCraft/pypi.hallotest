[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hallotest"
version = "1.0"
description = "A Test library"
readme = "README.md"
authors = [
    {name = "Luis Raub", email = "luisworkmail@proton.me"}
]
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]